[project]
name = "manual-ia-gen"
version = "0.1.0"
description = "Manual de referencias sobre IA generativa"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.spellcheck]
sources = ["index.qmd", "parts/**/*.qmd"]
backend = "todos"

# Términos que ningún diccionario reconoce y que aquí son correctos.
# Las siglas en mayúscula (RAG, MCP, GPAI) y los nombres en CamelCase
# (GraphRAG, OpenTelemetry, LiteLLM) los descarta el script por su cuenta,
# así que no hace falta listarlos. La comparación ignora mayúsculas: basta
# con declarar la forma en minúscula.
