project:
  type: book
  # Sin esto, Quarto renderizaría también los .ipynb de notebooks/, que son
  # cuadernos para Colab y no capítulos del libro.
  render:
    - "*.qmd"
    - "parts/**/*.qmd"

book:
  title: "Manual de IA Generativa"
  cover-image: logo-noback.png
  favicon: cover-removebg-preview.png
  site-url: https://iraitzm.github.io/manual-ia-generativa/
  #repo-url: https://github.com/IraitzM/manual-ia-generativa
  author: "Iraitz Montalbán"
  date: today
  page-navigation: true
  search: true
  #sharing: [linkedin]
  sidebar:
    collapse-level: 1
    content: auto
    pinned: false
    style: docked
    background: light
  page-footer:
    left: "Copyright 2026, Iraitz Montalbán"
    right:
      - icon: github
        href: https://github.com/IraitzM
      - icon: linkedin
        href: https://www.linkedin.com/in/iraitzmontalban/
    border: false
    background: light
  chapters:
    - index.qmd
    - parts/intro.qmd

    - part: parts/fundamentos/intro.qmd
      chapters:
      - parts/fundamentos/nlp.qmd
      - parts/fundamentos/redes.qmd

    - part: "Modelos generativos"
      chapters:
      - parts/modelos/mlgenerativa.qmd
      - parts/modelos/transformers.qmd
      - parts/modelos/inferencia.qmd
      - parts/modelos/panorama.qmd
      - parts/modelos/ajustefino.qmd

    - part: parts/contexto/intro.qmd
      chapters:
      - parts/contexto/prompting.qmd
      - parts/contexto/rag.qmd

    - part: "Agentes"
      chapters:
      - parts/agentes/queesunagente.qmd
      - parts/agentes/herramientas.qmd
      - parts/agentes/memoria.qmd
      - parts/agentes/orquestacion.qmd
      - parts/agentes/interfaz.qmd

    - part: "Producción"
      chapters:
      - parts/produccion/ecosistema.qmd
      - parts/produccion/gateways.qmd
      - parts/produccion/evaluacion.qmd
      - parts/produccion/observabilidad.qmd

    - part: "Normativa y seguridad"
      chapters:
      - parts/seguridad/retos.qmd
      - parts/seguridad/defensas.qmd
      - parts/normativa/leyes.qmd

    - parts/referencias.qmd

  appendices:
    - parts/apendices/copilotos.qmd
    - parts/apendices/glosario.qmd

bibliography: parts/references.bib

# Quarto no traduce esta etiqueta al español por defecto
language:
  section-title-appendices: "Apéndices"

format:
  html:
    number-depth: 2
    theme:
     - cosmo
     - style.scss
    code-link: true

# Some SEO
metadata:
  lang: es
  twitter-card: false
  open-graph: true
  image: logo-noback.png

resources:
  - robots.txt
